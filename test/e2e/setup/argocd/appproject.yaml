apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kick-e2e
  namespace: argocd
spec:
  description: Project for KICK integration scenarios.
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  # Required for KICK-E2E-025, which keeps its Application next to the workload
  # instead of in the Argo CD namespace.
  sourceNamespaces:
    - "kick-e2e-*"
---
# Scenarios that do not exercise project semantics use Argo CD's built-in
# `default` project. Argo CD only creates it on a fresh install, so the suite
# declares it as well and no longer depends on the state of a shared cluster.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
