apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-067
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-067
spec:
  discovery:
    workloadSelector: {}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-067
  namespace: kick-e2e-067
spec:
  provider: openbao
  parameters:
    roleName: kick-e2e
    baoAddress: http://openbao.csi.svc.cluster.local:8200
    objects: |
      - objectName: token
        secretPath: secret/data/kick-e2e-067
        secretKey: token
---
# Three replicas mean three SecretProviderClassPodStatus objects, each
# republished independently by the driver's rotation loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-067
  namespace: kick-e2e-067
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-067
  template:
    metadata:
      labels:
        app: app-067
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          volumeMounts:
            - name: app-secret
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: app-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: app-067
