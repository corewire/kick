apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-067-csi-staged-rotation-restarts-once
spec:
  steps:
    - name: seed-secret-material
      try:
        - script:
            content: |
              set -eu
              kubectl -n csi exec deploy/openbao -- \
                bao kv put secret/kick-e2e-067 token=alpha >/dev/null
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: assert-staged-rotation-produces-one-restart
      try:
        - script:
            content: |
              set -eu
              NS=kick-e2e-067
              deadline=$(( $(date +%s) + 420 ))

              while true; do
                ready=$(kubectl -n $NS get deployment app-067 -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
                statuses=$(kubectl -n $NS get secretproviderclasspodstatuses -o name 2>/dev/null | wc -l)
                if [ "${ready:-0}" -ge 3 ] && [ "$statuses" -ge 3 ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "app-067 did not reach three mounted replicas" >&2
                  kubectl -n $NS describe pods >&2 || true
                  exit 1
                fi
                sleep 3
              done

              generation_before=$(kubectl -n $NS get deployment app-067 -o jsonpath='{.metadata.generation}')
              versions_before=$(kubectl -n $NS get secretproviderclasspodstatuses -o jsonpath='{.items[*].status.objects[0].version}' 2>/dev/null || true)

              # The driver republishes each pod's status separately, so the
              # observed versions may disagree between pods while rotation is in
              # flight.
              kubectl -n csi exec deploy/openbao -- \
                bao kv put secret/kick-e2e-067 token=bravo >/dev/null

              while true; do
                versions_after=$(kubectl -n $NS get secretproviderclasspodstatuses -o jsonpath='{.items[*].status.objects[0].version}' 2>/dev/null || true)
                if [ -n "$versions_after" ] && [ "$versions_after" != "$versions_before" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "rotation did not refresh pod status versions for app-067" >&2
                  kubectl -n $NS get secretproviderclasspodstatuses -o yaml >&2 || true
                  kubectl -n $NS get kickrequests -o yaml >&2 || true
                  exit 1
                fi
                sleep 3
              done

              # Wait out several rotation polls and prove there was no restart.
              sleep 90
              kubectl -n $NS rollout status deployment/app-067 --timeout=120s

              generation_after=$(kubectl -n $NS get deployment app-067 -o jsonpath='{.metadata.generation}')
              if [ "$generation_after" -ne "$generation_before" ]; then
                echo "unexpected restart, generation went $generation_before -> $generation_after" >&2
                kubectl -n $NS get replicasets >&2 || true
                kubectl -n $NS get kickrequests -o yaml >&2 || true
                exit 1
              fi

              replicasets=$(kubectl -n $NS get replicasets -o name | wc -l)
              if [ "$replicasets" -ne 1 ]; then
                echo "expected a single ReplicaSet without restart, found $replicasets" >&2
                kubectl -n $NS get replicasets >&2 || true
                exit 1
              fi
    - name: cleanup
      try:
        - script:
            content: |
              set -eu
              kubectl -n csi exec deploy/openbao -- \
                bao kv metadata delete secret/kick-e2e-067 >/dev/null
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-067
