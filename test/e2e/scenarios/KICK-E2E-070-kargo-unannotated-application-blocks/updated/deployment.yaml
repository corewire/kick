apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-070
  namespace: kick-e2e-070
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-070
  template:
    metadata:
      labels:
        app: app-070
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
