apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-007
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-007
spec:
  discovery:
    workloadSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-007
  namespace: kick-e2e-007
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-007
  template:
    metadata:
      labels:
        app: app-007
    spec:
      initContainers:
        - name: init
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["sh", "-c", "true"]
          envFrom:
            - secretRef:
                name: app-secret
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-007
type: Opaque
stringData:
  token: alpha
