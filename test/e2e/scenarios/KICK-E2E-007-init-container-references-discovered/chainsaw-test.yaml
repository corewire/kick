apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-007-init-container-references-discovered
spec:
  steps:
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: assert-dependency-change-restarts-workload
      try:
        - script:
            content: |
              set -eu
              NS=kick-e2e-007
              deadline=$(( $(date +%s) + 150 ))

              # 1. Baseline: KICK discovers the dependency and settles the request
              #    terminal by adopting the workload's initial rollout.
              while true; do
                phase=$(kubectl -n $NS get kickrequest deployment-app-007 -o jsonpath='{.status.phase}' 2>/dev/null || true)
                if [ "$phase" = "Succeeded" ] || [ "$phase" = "NoLongerRequired" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "baseline KickRequest deployment-app-007 never settled" >&2
                  kubectl -n $NS get kickrequests -o yaml >&2 || true
                  exit 1
                fi
                sleep 3
              done

              # Correctness: the baseline must NOT have restarted the workload.
              before=$(kubectl -n $NS get deployment app-007 -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}' 2>/dev/null || true)
              if [ -n "$before" ]; then
                echo "baseline unexpectedly restarted app-007" >&2
                kubectl -n $NS get deployment app-007 -o yaml >&2 || true
                exit 1
              fi

              # 2. Mutate the referenced dependency (a relevant change).
              kubectl -n $NS patch secret app-secret --type merge -p '{"stringData":{"token":"bravo"}}'

              # 3. The change MUST actually restart the workload: KICK stamps the
              #    pod template with kubectl.kubernetes.io/restartedAt.
              while true; do
                after=$(kubectl -n $NS get deployment app-007 -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}' 2>/dev/null || true)
                if [ -n "$after" ] && [ "$after" != "$before" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "dependency change did not restart app-007" >&2
                  kubectl -n $NS get deployment app-007 -o yaml >&2 || true
                  kubectl -n $NS get kickrequest deployment-app-007 -o yaml >&2 || true
                  exit 1
                fi
                sleep 3
              done
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-007
