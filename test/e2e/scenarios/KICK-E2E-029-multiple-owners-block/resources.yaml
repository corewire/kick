apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-029
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-029
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
# Two Applications render the same path into the same namespace, so both list
# app-029 in status.resources. Only this one syncs; the second is left
# unsynced so the two do not fight over the live resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-029-a
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-029.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-029
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-029-b
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-029.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-029
