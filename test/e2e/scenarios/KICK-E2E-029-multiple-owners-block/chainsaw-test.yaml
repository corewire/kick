apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-029-multiple-owners-block
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-029 manifests manifests
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-two-claimants
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-029-a
                namespace: argocd
              status:
                sync:
                  status: Synced
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-029
                namespace: kick-e2e-029
                generation: 1
              status:
                availableReplicas: 1
        # Both Applications must list the Deployment before the ownership scan
        # can be ambiguous.
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-029-b
                namespace: argocd
              status:
                (resources[?kind == 'Deployment' && name == 'app-029'] | length(@)): 1
    - name: change-secret-in-git
      try:
        - script:
            content: ../../setup/gitea/commit-file.sh e2e-029 manifests updated/secret.yaml "rotate app-secret"
        - script:
            content: |
              kubectl -n argocd annotate application kick-e2e-029-a \
                argocd.argoproj.io/refresh=hard --overwrite
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: app-secret
                namespace: kick-e2e-029
              data:
                # base64 of "beta"
                token: YmV0YQ==
    - name: assert-ambiguous-owner-blocks
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-029
                namespace: kick-e2e-029
              status:
                phase: WaitingForOwner
                gate:
                  reason: AmbiguousOwner
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-029
                namespace: kick-e2e-029
                generation: 1
    - name: cleanup
      try:
        - script:
            content: |
              kubectl -n argocd delete application kick-e2e-029-a kick-e2e-029-b --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-029
