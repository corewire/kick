apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-012-configmap-data-update-relevant
spec:
  steps:
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: assert-dependency-change-restarts-workload
      try:
        - script:
            content: |
              set -eu
              NS=kick-e2e-012
              deadline=$(( $(date +%s) + 150 ))

              # 1. Baseline: KICK discovers the dependency and settles the request
              #    terminal by adopting the workload's initial rollout.
              while true; do
                phase=$(kubectl -n $NS get kickrequest deployment-config-api -o jsonpath='{.status.phase}' 2>/dev/null || true)
                if [ "$phase" = "Succeeded" ] || [ "$phase" = "NoLongerRequired" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "baseline KickRequest deployment-config-api never settled" >&2
                  kubectl -n $NS get kickrequests -o yaml >&2 || true
                  exit 1
                fi
                sleep 3
              done

              # Correctness: the baseline must NOT have restarted the workload.
              before=$(kubectl -n $NS get deployment config-api -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}' 2>/dev/null || true)
              if [ -n "$before" ]; then
                echo "baseline unexpectedly restarted config-api" >&2
                kubectl -n $NS get deployment config-api -o yaml >&2 || true
                exit 1
              fi

              # 2. Mutate the referenced dependency (a relevant change).
              kubectl -n $NS patch configmap app-config --type merge -p '{"data":{"mode":"bravo"}}'

              # 3. The change MUST actually restart the workload: KICK stamps the
              #    pod template with kubectl.kubernetes.io/restartedAt.
              while true; do
                after=$(kubectl -n $NS get deployment config-api -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}' 2>/dev/null || true)
                if [ -n "$after" ] && [ "$after" != "$before" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "dependency change did not restart config-api" >&2
                  kubectl -n $NS get deployment config-api -o yaml >&2 || true
                  kubectl -n $NS get kickrequest deployment-config-api -o yaml >&2 || true
                  exit 1
                fi
                sleep 3
              done
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-012
