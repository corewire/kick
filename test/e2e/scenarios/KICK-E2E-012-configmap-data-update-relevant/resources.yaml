apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-012
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-012
spec:
  discovery:
    workloadSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-api
  namespace: kick-e2e-012
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-api
  template:
    metadata:
      labels:
        app: config-api
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kick-e2e-012
data:
  mode: alpha
