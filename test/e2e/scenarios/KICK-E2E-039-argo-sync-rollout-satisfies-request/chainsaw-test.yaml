apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-039-argo-sync-rollout-satisfies-request
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-039 manifests manifests
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-sync
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-039
                namespace: argocd
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-039
                namespace: kick-e2e-039
                generation: 1
              status:
                availableReplicas: 1
    - name: commit-secret-and-pod-template
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-039 manifests updated "rotate secret and roll the pod template"
        - script:
            content: kubectl -n argocd annotate application kick-e2e-039 argocd.argoproj.io/refresh=hard --overwrite
    - name: assert-argo-rollout-satisfies-the-request
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-039
                namespace: kick-e2e-039
              status:
                phase: NoLongerRequired
        # Generation 2 is Argo CD's own template change. A KICK restart would
        # have produced a third generation.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-039
                namespace: kick-e2e-039
                generation: 2
              spec:
                template:
                  metadata:
                    annotations:
                      release: r2
        - script:
            content: |
              restarted_at=$(kubectl -n kick-e2e-039 get deployment app-039 \
                -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}')
              if [ -n "$restarted_at" ]; then
                echo "KICK restarted the workload even though Argo CD already did"
                exit 1
              fi
    - name: cleanup
      try:
        - script:
            content: kubectl -n argocd delete application kick-e2e-039 --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-039
