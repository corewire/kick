apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-039
type: Opaque
stringData:
  token: alpha
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-039
  namespace: kick-e2e-039
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-039
  template:
    metadata:
      labels:
        app: app-039
      annotations:
        release: r1
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
