apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-039
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-039
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-039
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-039.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-039
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
