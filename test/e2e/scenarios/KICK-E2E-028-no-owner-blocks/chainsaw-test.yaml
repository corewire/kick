apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-028-no-owner-blocks
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-028 unrelated-app unrelated-app
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-state
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-028-unrelated
                namespace: argocd
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-028
                namespace: kick-e2e-028
                generation: 1
              status:
                availableReplicas: 1
    - name: rotate-secret
      try:
        - apply:
            file: updated/secret.yaml
    - name: assert-owner-unknown-blocks
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-028
                namespace: kick-e2e-028
              status:
                phase: WaitingForOwner
                gate:
                  reason: OwnerUnknown
        # The gate never opens, so the pod template is never touched.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-028
                namespace: kick-e2e-028
                generation: 1
    - name: cleanup
      try:
        - script:
            content: kubectl -n argocd delete application kick-e2e-028-unrelated --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-028
