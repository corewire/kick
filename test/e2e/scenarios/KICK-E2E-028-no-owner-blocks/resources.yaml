apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-028
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-028
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
# An Argo CD Application is present in the same namespace but manages something
# else entirely. The status.resources scan therefore runs and still finds no
# owner for app-028, which is stronger than testing against an empty cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-028-unrelated
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-028.git
    targetRevision: main
    path: unrelated-app
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-028
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Applied straight to the cluster, so no Application ever claims it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-028
  namespace: kick-e2e-028
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-028
  template:
    metadata:
      labels:
        app: app-028
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-028
type: Opaque
stringData:
  token: alpha
