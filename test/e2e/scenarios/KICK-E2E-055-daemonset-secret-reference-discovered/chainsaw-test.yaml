apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-055-daemonset-secret-reference-discovered
spec:
  steps:
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: assert-dependency-change-restarts-workload
      try:
        - script:
            content: |
              set -eu
              NS=kick-e2e-055
              deadline=$(( $(date +%s) + 150 ))

              # 1. Baseline: the secret exists before the workload, so the pods
              #    start from its current content and KICK must leave them alone.
              #    KICK evaluates a workload when it observes a change to one of
              #    its sources, so a workload created after all of its sources are
              #    already observed is fresh by construction and gets no
              #    KickRequest at all. Wait until the workload runs and KICK has
              #    recorded its observation of the secret (one Lease per source).
              while true; do
                ready=$(kubectl -n $NS get daemonset app-055 -o jsonpath='{.status.numberReady}' 2>/dev/null || true)
                observed=$(kubectl -n $NS get leases -o name 2>/dev/null | wc -l)
                if [ "${ready:-0}" -ge 1 ] && [ "$observed" -ge 1 ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "baseline for app-055 never settled" >&2
                  kubectl -n $NS get daemonsets,leases,kickrequests -o yaml >&2 || true
                  exit 1
                fi
                sleep 3
              done

              # Correctness: the baseline must NOT have restarted the workload.
              before=$(kubectl -n $NS get daemonset app-055 -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}' 2>/dev/null || true)
              if [ -n "$before" ]; then
                echo "baseline unexpectedly restarted app-055" >&2
                kubectl -n $NS get daemonset app-055 -o yaml >&2 || true
                exit 1
              fi

              # 2. Mutate the referenced dependency (a relevant change).
              kubectl -n $NS patch secret app-secret --type merge -p '{"stringData":{"token":"bravo"}}'

              # 3. The change MUST actually restart the workload: KICK stamps the
              #    pod template with kubectl.kubernetes.io/restartedAt.
              while true; do
                after=$(kubectl -n $NS get daemonset app-055 -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}' 2>/dev/null || true)
                if [ -n "$after" ] && [ "$after" != "$before" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "dependency change did not restart app-055" >&2
                  kubectl -n $NS get daemonset app-055 -o yaml >&2 || true
                  kubectl -n $NS get kickrequest daemonset-app-055 -o yaml >&2 || true
                  exit 1
                fi
                sleep 3
              done
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-055
