apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-055
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-055
spec:
  discovery: {}
  gitOps:
    provider: Auto
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: app-055
  namespace: kick-e2e-055
spec:
  selector:
    matchLabels:
      app: app-055
  template:
    metadata:
      labels:
        app: app-055
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-055
type: Opaque
stringData:
  token: alpha
