apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-020
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-020
spec:
  discovery:
    mode: Auto
  gitOps:
    provider: Auto
    schedule:
      source: None
      windows:
        - kind: Allow
          schedule: "* * * * *"
          duration: 1m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-020
  namespace: kick-e2e-020
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-020
  template:
    metadata:
      labels:
        app: app-020
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-020
type: Opaque
stringData:
  token: alpha
