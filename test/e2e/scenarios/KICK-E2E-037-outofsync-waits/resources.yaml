apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-037
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-037
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-037
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-037.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-037
  syncPolicy:
    # Automated but without self-heal: Argo CD syncs new commits, yet leaves
    # in-cluster drift alone. That lets the test park the Application in a
    # stable OutOfSync state.
    automated:
      prune: false
      selfHeal: false
---
# The consumed Secret is not managed by Argo CD, so rotating it cannot change
# the Application's sync status.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-037
type: Opaque
stringData:
  token: alpha
