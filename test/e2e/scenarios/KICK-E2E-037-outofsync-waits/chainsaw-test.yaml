apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-037-outofsync-waits
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-037 manifests manifests
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-sync
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-037
                namespace: argocd
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-037
                namespace: kick-e2e-037
                generation: 1
              status:
                availableReplicas: 1
    - name: drift-the-application
      try:
        - apply:
            file: drift/configmap.yaml
        - script:
            content: kubectl -n argocd annotate application kick-e2e-037 argocd.argoproj.io/refresh=hard --overwrite
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-037
                namespace: argocd
              status:
                sync:
                  status: OutOfSync
    - name: rotate-secret
      try:
        - apply:
            file: updated/secret.yaml
    - name: assert-outofsync-owner-blocks
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-037
                namespace: kick-e2e-037
              status:
                phase: WaitingForApplicationSync
                gate:
                  reason: OwnerOutOfSync
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-037
                namespace: kick-e2e-037
                generation: 1
    - name: cleanup
      try:
        - script:
            content: kubectl -n argocd delete application kick-e2e-037 --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-037
