apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-080
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-080
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: Flux
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-080
stringData:
  token: alpha
---
# Claims a Kustomization that does not exist, e.g. one deleted with prune off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-080
  namespace: kick-e2e-080
  labels:
    kustomize.toolkit.fluxcd.io/name: deleted
    kustomize.toolkit.fluxcd.io/namespace: kick-e2e-080
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-080
  template:
    metadata:
      labels:
        app: app-080
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
