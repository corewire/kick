apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-030
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-030
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
# A project that is not `default`, living in the Argo CD namespace. KICK must
# look the AppProject up there; if it looked in the workload namespace the gate
# would report ProjectUnknown instead of allowing the kick.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kick-e2e-030
  namespace: argocd
spec:
  description: Dedicated project for KICK-E2E-030.
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-030
  namespace: argocd
spec:
  project: kick-e2e-030
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-030.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-030
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
