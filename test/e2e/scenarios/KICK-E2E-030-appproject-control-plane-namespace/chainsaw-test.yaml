apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-030-appproject-control-plane-namespace
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-030 manifests manifests
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-sync
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-030
                namespace: argocd
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-030
                namespace: kick-e2e-030
                generation: 1
              status:
                availableReplicas: 1
    - name: change-secret-in-git
      try:
        - script:
            content: ../../setup/gitea/commit-file.sh e2e-030 manifests updated/secret.yaml "rotate app-secret"
        - script:
            content: |
              kubectl -n argocd annotate application kick-e2e-030 \
                argocd.argoproj.io/refresh=hard --overwrite
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: app-secret
                namespace: kick-e2e-030
              data:
                # base64 of "beta"
                token: YmV0YQ==
    - name: assert-project-resolved-and-kicked
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-030
                namespace: kick-e2e-030
              status:
                phase: Succeeded
                owner:
                  provider: argocd
                  kind: Application
                  namespace: argocd
                  name: kick-e2e-030
                  project: kick-e2e-030
                gate:
                  reason: Allowed
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-030
                namespace: kick-e2e-030
                generation: 2
    - name: cleanup
      try:
        - script:
            content: |
              kubectl -n argocd delete application kick-e2e-030 --ignore-not-found
              kubectl -n argocd delete appproject kick-e2e-030 --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-030
