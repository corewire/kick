apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-079
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-079
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: Flux
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-079
stringData:
  token: alpha
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: repo
  namespace: kick-e2e-079
spec:
  interval: 1m
  url: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-079.git
  ref:
    branch: main
---
# helm-controller's post-renderer labels every rendered object with
# helm.toolkit.fluxcd.io/name and /namespace; that is the owner KICK resolves.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app
  namespace: kick-e2e-079
spec:
  interval: 1m
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: repo
