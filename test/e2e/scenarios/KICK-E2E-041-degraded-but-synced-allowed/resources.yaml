apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-041
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-041
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-041
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-041.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-041
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Rotated in the cluster, not in git, so the Application stays Synced while the
# broken sibling workload keeps it Degraded.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-041
type: Opaque
stringData:
  token: alpha
