apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-041-degraded-but-synced-allowed
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-041 manifests manifests
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-synced-but-degraded-application
      try:
        - assert:
            timeout: 3m
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-041
                namespace: argocd
              status:
                sync:
                  status: Synced
                health:
                  status: Degraded
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-041
                namespace: kick-e2e-041
                generation: 1
              status:
                availableReplicas: 1
    - name: rotate-secret
      try:
        - apply:
            file: updated/secret.yaml
    - name: assert-degraded-health-does-not-block-the-kick
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-041
                namespace: kick-e2e-041
              status:
                phase: Succeeded
                gate:
                  reason: Allowed
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-041
                namespace: kick-e2e-041
                generation: 2
    - name: cleanup
      try:
        - script:
            content: kubectl -n argocd delete application kick-e2e-041 --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-041
