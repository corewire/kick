apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-024
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-024
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
# The Application that actually deploys the workload. Its status.resources lists
# app-024, so owner resolution by fallback would pick this one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-024
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-024.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-024
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# The workload's tracking-id annotation points here instead. This Application
# never lists app-024 in status.resources, so resolving to it proves the
# annotation took precedence over the status.resources scan.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-024-annotated
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-024.git
    targetRevision: main
    path: annotated-app
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-024
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
