apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: app-062
  namespace: kick-e2e-062
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-062
  template:
    metadata:
      labels:
        app: app-062
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          env:
            - name: REVISION
              value: "2"
          envFrom:
            - secretRef:
                name: app-secret
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause:
            duration: 60s
