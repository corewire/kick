apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-054
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-054
spec:
  discovery: {}
  gitOps:
    provider: Auto
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-054
  namespace: kick-e2e-054
spec:
  serviceName: app-054
  replicas: 1
  selector:
    matchLabels:
      app: app-054
  template:
    metadata:
      labels:
        app: app-054
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-054
type: Opaque
stringData:
  token: alpha
