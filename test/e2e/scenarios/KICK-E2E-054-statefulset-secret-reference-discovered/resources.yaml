apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-054
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-054
spec:
  discovery:
    workloadSelector: {}
---
# The secret is declared before the workload so that it provably exists before
# the StatefulSet is created. A source that only appears afterwards is a source
# the running pods never had, which KICK restarts for on purpose (KICK-E2E-010),
# and this scenario is about discovery and rotation instead.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-054
type: Opaque
stringData:
  token: alpha
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-054
  namespace: kick-e2e-054
spec:
  serviceName: app-054
  replicas: 1
  selector:
    matchLabels:
      app: app-054
  template:
    metadata:
      labels:
        app: app-054
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
