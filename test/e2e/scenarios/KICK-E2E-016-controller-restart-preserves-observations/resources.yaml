apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-016
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-016
spec:
  discovery: {}
  gitOps:
    provider: Auto
    schedule:
      source: None
      windows:
        - kind: Allow
          schedule: "* * * * *"
          duration: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-016
  namespace: kick-e2e-016
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-016
  template:
    metadata:
      labels:
        app: app-016
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-016
type: Opaque
stringData:
  token: alpha
