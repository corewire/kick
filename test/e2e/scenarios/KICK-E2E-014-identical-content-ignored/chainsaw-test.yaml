apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-014-identical-content-ignored
spec:
  steps:
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: assert-request-created
      try:
        - script:
            content: |
              set -eu
              deadline=$(( $(date +%s) + 120 ))
              while true; do
                count=$(kubectl -n kick-e2e-014 get kickrequests --no-headers 2>/dev/null | wc -l | tr -d ' ')
                phase=$(kubectl -n kick-e2e-014 get kickrequest app-014 -o jsonpath='{.status.phase}' 2>/dev/null || true)
                reason=$(kubectl -n kick-e2e-014 get kickrequest app-014 -o jsonpath='{.status.gate.reason}' 2>/dev/null || true)
                latest=$(kubectl -n kick-e2e-014 get kickrequest app-014 -o jsonpath='{.status.latestObservedDependencyChange}' 2>/dev/null || true)
                if [ "$count" = "1" ] && [ "$phase" = "WaitingForOwner" ] && [ "$reason" = "OwnerUnknown" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "expected one WaitingForOwner request for app-014" >&2
                  kubectl -n kick-e2e-014 get kickrequests -o yaml >&2 || true
                  exit 1
                fi
                sleep 2
              done

              initial=$(kubectl -n kick-e2e-014 get kickrequest app-014 -o jsonpath='{.status.latestObservedDependencyChange}')
              kubectl -n kick-e2e-014 apply -f - <<'EOF'
              apiVersion: v1
              kind: Secret
              metadata:
                name: app-secret
                namespace: kick-e2e-014
              type: Opaque
              stringData:
                token: alpha
              EOF
              sleep 6
              updated=$(kubectl -n kick-e2e-014 get kickrequest app-014 -o jsonpath='{.status.latestObservedDependencyChange}')
              if [ "$updated" != "$initial" ]; then
                echo "identical content unexpectedly changed timestamp" >&2
                kubectl -n kick-e2e-014 get kickrequest app-014 -o yaml >&2 || true
                exit 1
              fi
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-014
