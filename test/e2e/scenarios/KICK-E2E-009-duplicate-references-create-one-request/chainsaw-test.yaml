apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-009-duplicate-references-create-one-request
spec:
  steps:
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: assert-single-request
      try:
        - script:
            content: |
              set -eu
              deadline=$(( $(date +%s) + 90 ))
              while true; do
                count=$(kubectl -n kick-e2e-009 get kickrequests --no-headers 2>/dev/null | wc -l | tr -d ' ')
                phase=$(kubectl -n kick-e2e-009 get kickrequest duplicate-api -o jsonpath='{.status.phase}' 2>/dev/null || true)
                reason=$(kubectl -n kick-e2e-009 get kickrequest duplicate-api -o jsonpath='{.status.gate.reason}' 2>/dev/null || true)
                target=$(kubectl -n kick-e2e-009 get kickrequest duplicate-api -o jsonpath='{.spec.targetRef.name}' 2>/dev/null || true)
                latest=$(kubectl -n kick-e2e-009 get kickrequest duplicate-api -o jsonpath='{.status.latestObservedDependencyChange}' 2>/dev/null || true)
                if [ "$count" = "1" ] && [ "$phase" = "WaitingForOwner" ] && [ "$reason" = "OwnerUnknown" ] && [ "$target" = "duplicate-api" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "expected one KickRequest with WaitingForOwner/OwnerUnknown for duplicate-api" >&2
                  kubectl -n kick-e2e-009 get kickrequests -o yaml >&2 || true
                  exit 1
                fi
                sleep 2
              done
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-009
