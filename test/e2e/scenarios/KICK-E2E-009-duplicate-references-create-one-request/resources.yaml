apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-009
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-009
spec:
  discovery: {}
  gitOps:
    provider: Auto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duplicate-api
  namespace: kick-e2e-009
spec:
  replicas: 1
  selector:
    matchLabels:
      app: duplicate-api
  template:
    metadata:
      labels:
        app: duplicate-api
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: shared-secret
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: token
---
apiVersion: v1
kind: Secret
metadata:
  name: shared-secret
  namespace: kick-e2e-009
type: Opaque
stringData:
  token: fake-token
