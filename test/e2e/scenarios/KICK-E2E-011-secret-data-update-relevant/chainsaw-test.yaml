apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-011-secret-data-update-relevant
spec:
  steps:
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: assert-relevant-update-advances-timestamp
      try:
        - script:
            content: |
              set -eu
              deadline=$(( $(date +%s) + 120 ))
              initial=""
              while true; do
                count=$(kubectl -n kick-e2e-011 get kickrequests --no-headers 2>/dev/null | wc -l | tr -d ' ')
                initial=$(kubectl -n kick-e2e-011 get kickrequest secret-api -o jsonpath='{.status.latestObservedDependencyChange}' 2>/dev/null || true)
                if [ "$count" = "1" ] && [ -n "$initial" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "expected initial KickRequest and timestamp for secret-api" >&2
                  kubectl -n kick-e2e-011 get kickrequests -o yaml >&2 || true
                  exit 1
                fi
                sleep 2
              done

              kubectl -n kick-e2e-011 patch secret app-secret --type merge -p '{"stringData":{"token":"bravo"}}'

              while true; do
                count=$(kubectl -n kick-e2e-011 get kickrequests --no-headers 2>/dev/null | wc -l | tr -d ' ')
                updated=$(kubectl -n kick-e2e-011 get kickrequest secret-api -o jsonpath='{.status.latestObservedDependencyChange}' 2>/dev/null || true)
                if [ "$count" = "1" ] && [ -n "$updated" ] && [ "$updated" != "$initial" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "expected relevant Secret update to advance latestObservedDependencyChange" >&2
                  kubectl -n kick-e2e-011 get secret app-secret -o yaml >&2 || true
                  kubectl -n kick-e2e-011 get kickrequest secret-api -o yaml >&2 || true
                  exit 1
                fi
                sleep 2
              done
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-011
