apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-011
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-011
spec:
  discovery:
    workloadSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-api
  namespace: kick-e2e-011
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-api
  template:
    metadata:
      labels:
        app: secret-api
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-011
type: Opaque
stringData:
  token: alpha
