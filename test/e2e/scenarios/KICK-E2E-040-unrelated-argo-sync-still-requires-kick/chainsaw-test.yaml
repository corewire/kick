apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-040-unrelated-argo-sync-still-requires-kick
spec:
  steps:
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: assert-request-created
      try:
        - script:
            content: |
              set -eu
              deadline=$(( $(date +%s) + 120 ))
              while true; do
                count=$(kubectl -n kick-e2e-040 get kickrequests --no-headers 2>/dev/null | wc -l | tr -d ' ')
                phase=$(kubectl -n kick-e2e-040 get kickrequest app-040 -o jsonpath='{.status.phase}' 2>/dev/null || true)
                reason=$(kubectl -n kick-e2e-040 get kickrequest app-040 -o jsonpath='{.status.gate.reason}' 2>/dev/null || true)
                latest=$(kubectl -n kick-e2e-040 get kickrequest app-040 -o jsonpath='{.status.latestObservedDependencyChange}' 2>/dev/null || true)
                if [ "$count" = "1" ] && [ "$phase" = "WaitingForOwner" ] && [ "$reason" = "OwnerUnknown" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "expected one WaitingForOwner request for app-040" >&2
                  kubectl -n kick-e2e-040 get kickrequests -o yaml >&2 || true
                  exit 1
                fi
                sleep 2
              done

                            phase=$(kubectl -n kick-e2e-040 get kickrequest app-040 -o jsonpath='{.status.phase}')
                            reason=$(kubectl -n kick-e2e-040 get kickrequest app-040 -o jsonpath='{.status.gate.reason}')
                            if [ "$phase" != "WaitingForOwner" ] || [ "$reason" != "OwnerUnknown" ]; then
                              echo "expected stable OwnerUnknown gate for baseline scenario" >&2
                              kubectl -n kick-e2e-040 get kickrequest app-040 -o yaml >&2 || true
                              exit 1
                            fi
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-040
