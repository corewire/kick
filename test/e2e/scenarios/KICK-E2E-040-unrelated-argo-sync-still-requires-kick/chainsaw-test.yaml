apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-040-unrelated-argo-sync-still-requires-kick
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-040 manifests manifests
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-sync
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-040
                namespace: argocd
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-040
                namespace: kick-e2e-040
                generation: 1
              status:
                availableReplicas: 1
    - name: commit-unrelated-and-consumed-change
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-040 manifests updated "bump unrelated ConfigMap and rotate the consumed Secret"
        - script:
            content: kubectl -n argocd annotate application kick-e2e-040 argocd.argoproj.io/refresh=hard --overwrite
    - name: assert-kick-still-restarts-the-workload
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-040
                namespace: kick-e2e-040
              status:
                phase: Succeeded
                gate:
                  reason: Allowed
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-040
                namespace: kick-e2e-040
                generation: 2
        - script:
            content: |
              restarted_at=$(kubectl -n kick-e2e-040 get deployment app-040 \
                -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}')
              if [ -z "$restarted_at" ]; then
                echo "the rollout did not come from KICK"
                exit 1
              fi
    - name: assert-no-kick-request-for-the-unrelated-configmap
      try:
        - script:
            content: |
              names=$(kubectl -n kick-e2e-040 get kickrequests -o name)
              if [ "$names" != "kickrequest.kick.corewire.io/deployment-app-040" ]; then
                echo "unexpected KickRequests: $names"
                exit 1
              fi
    - name: cleanup
      try:
        - script:
            content: kubectl -n argocd delete application kick-e2e-040 --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-040
