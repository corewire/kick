apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-025
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-025
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
# "Apps in any namespace": both Applications live next to the workload instead
# of in the Argo CD namespace. The manager is started with
# --argocd-application-namespaces=argocd,kick-e2e-025 (see config/e2e).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-025
  namespace: kick-e2e-025
spec:
  project: kick-e2e
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-025.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-025
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# The workload's tracking-id annotation points here. This Application never
# lists app-025 in status.resources, so resolving to it proves the annotation
# was honoured outside the Argo CD namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-025-annotated
  namespace: kick-e2e-025
spec:
  project: kick-e2e
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-025.git
    targetRevision: main
    path: annotated-app
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-025
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
