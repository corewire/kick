apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-025
  namespace: kick-e2e-025
  annotations:
    # Names an Application that lives outside the Argo CD namespace.
    argocd.argoproj.io/tracking-id: "kick-e2e-025-annotated:apps/Deployment:kick-e2e-025/app-025"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-025
  template:
    metadata:
      labels:
        app: app-025
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
