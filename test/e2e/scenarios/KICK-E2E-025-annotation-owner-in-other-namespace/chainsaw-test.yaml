apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-025-annotation-owner-in-other-namespace
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-025 manifests manifests
        - script:
            content: ../../setup/gitea/seed.sh e2e-025 annotated-app annotated-app
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-sync
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-025
                namespace: kick-e2e-025
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-025-annotated
                namespace: kick-e2e-025
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-025
                namespace: kick-e2e-025
              status:
                availableReplicas: 1
    - name: change-secret-in-git
      try:
        - script:
            content: ../../setup/gitea/commit-file.sh e2e-025 manifests updated/secret.yaml "rotate app-secret"
        - script:
            content: |
              kubectl -n kick-e2e-025 annotate application kick-e2e-025 \
                argocd.argoproj.io/refresh=hard --overwrite
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: app-secret
                namespace: kick-e2e-025
              data:
                # base64 of "beta"
                token: YmV0YQ==
    - name: assert-owner-outside-argo-cd-namespace
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-025
                namespace: kick-e2e-025
              status:
                phase: WaitingForOwner
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-025
                namespace: kick-e2e-025
              status:
                availableReplicas: 1
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-025
