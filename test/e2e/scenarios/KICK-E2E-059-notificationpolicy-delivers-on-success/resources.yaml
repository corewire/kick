apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-059
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-059
spec:
  discovery:
    workloadSelector: {}
---
apiVersion: kick.corewire.io/v1alpha1
kind: NotificationPolicy
metadata:
  name: default
  namespace: kick-e2e-059
spec:
  phases:
    - Succeeded
  webhook:
    # The API server is guaranteed to exist and to reject this request, which
    # exercises the whole delivery path (matching, sending, status reporting)
    # without shipping an extra receiver image into the cluster.
    url: https://kubernetes.default.svc/kick-e2e-059-webhook
    timeoutSeconds: 5
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-059
type: Opaque
stringData:
  token: alpha
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: kick-e2e-059
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
