apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-010-optional-missing-secret-creation-triggers-kick
spec:
  steps:
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: assert-creating-optional-secret-restarts-workload
      try:
        - script:
            content: |
              set -eu
              NS=kick-e2e-010
              deadline=$(( $(date +%s) + 150 ))

              # The optional Secret is absent at start: the workload runs and must
              # NOT be restarted while the reference stays unresolved.
              while true; do
                avail=$(kubectl -n $NS get deployment app-010 -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
                if [ "$avail" = "1" ]; then break; fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "deployment app-010 never became available" >&2
                  kubectl -n $NS get deployment app-010 -o yaml >&2 || true
                  exit 1
                fi
                sleep 3
              done

              before=$(kubectl -n $NS get deployment app-010 -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}' 2>/dev/null || true)
              if [ -n "$before" ]; then
                echo "workload restarted before the optional secret existed" >&2
                exit 1
              fi

              # Avoid same-second timestamp ties with the baseline rollout when
              # creating the previously missing optional Secret.
              sleep 2

              # Creating the previously-missing optional Secret is a relevant change.
              kubectl -n $NS apply -f optional-secret.yaml

              while true; do
                after=$(kubectl -n $NS get deployment app-010 -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}' 2>/dev/null || true)
                if [ -n "$after" ] && [ "$after" != "$before" ]; then break; fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "creating the optional secret did not restart app-010" >&2
                  kubectl -n $NS get deployment app-010 -o yaml >&2 || true
                  kubectl -n $NS get kickrequests -o yaml >&2 || true
                  exit 1
                fi
                sleep 3
              done
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-010
