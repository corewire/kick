apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-027-fallback-finds-one-owner
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh scenarios/027 manifests
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-sync
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-027
                namespace: argocd
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        # generation 1 proves the pod template has not been touched yet.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-027
                namespace: kick-e2e-027
                generation: 1
              status:
                availableReplicas: 1
    - name: change-secret-in-git
      try:
        - script:
            content: ../../setup/gitea/commit-file.sh scenarios/027 updated/secret.yaml "rotate app-secret"
        - script:
            content: |
              kubectl -n argocd annotate application kick-e2e-027 \
                argocd.argoproj.io/refresh=hard --overwrite
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: app-secret
                namespace: kick-e2e-027
              data:
                # base64 of "beta"
                token: YmV0YQ==
    - name: assert-restart-happens
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-027
                namespace: kick-e2e-027
              status:
                phase: Succeeded
                owner:
                  provider: argocd
                  kind: Application
                  name: kick-e2e-027
        # Exactly one rollout: generation 2, not 3.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-027
                namespace: kick-e2e-027
                generation: 2
    - name: cleanup
      try:
        - script:
            content: kubectl -n argocd delete application kick-e2e-027 --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-027
