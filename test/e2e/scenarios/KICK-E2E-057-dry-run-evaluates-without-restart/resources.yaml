apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-057
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-057
spec:
  # Evaluate everything, but never patch a workload.
  dryRun: true
  discovery:
    workloadSelector: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-057
type: Opaque
stringData:
  token: alpha
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: kick-e2e-057
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
