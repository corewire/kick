apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-032-open-window-and-synced-allows-kick
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-032 manifests manifests
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-sync
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-032
                namespace: argocd
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-032
                namespace: kick-e2e-032
                generation: 1
              status:
                availableReplicas: 1
    - name: open-the-window
      try:
        - apply:
            file: windows.yaml
    - name: rotate-secret
      try:
        - apply:
            file: updated/secret.yaml
    - name: assert-open-window-allows-kick
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-032
                namespace: kick-e2e-032
              status:
                phase: Succeeded
                gate:
                  reason: Allowed
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-032
                namespace: kick-e2e-032
                generation: 2
    - name: cleanup
      try:
        - script:
            content: |
              kubectl -n argocd delete application kick-e2e-032 --ignore-not-found
              kubectl -n argocd delete appproject kick-e2e-032 --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-032
