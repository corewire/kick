apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-061
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-061
spec:
  discovery:
    workloadSelector: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-061
type: Opaque
stringData:
  token: alpha
---
apiVersion: v1
kind: Service
metadata:
  name: app-061-active
  namespace: kick-e2e-061
spec:
  selector:
    app: app-061
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-061-preview
  namespace: kick-e2e-061
spec:
  selector:
    app: app-061
  ports:
    - port: 80
      targetPort: 8080
