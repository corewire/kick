apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-031-missing-appproject-blocks
spec:
  steps:
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-state
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-031
                namespace: kick-e2e-031
                generation: 1
              status:
                availableReplicas: 1
    - name: rotate-secret
      try:
        - apply:
            file: updated/secret.yaml
    - name: assert-missing-project-blocks
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-031
                namespace: kick-e2e-031
              status:
                phase: WaitingForGate
                owner:
                  provider: argocd
                  kind: Application
                  namespace: argocd
                  name: kick-e2e-031
                gate:
                  reason: ProjectUnknown
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-031
                namespace: kick-e2e-031
                generation: 1
    - name: cleanup
      try:
        - script:
            content: kubectl -n argocd delete application kick-e2e-031 --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-031
