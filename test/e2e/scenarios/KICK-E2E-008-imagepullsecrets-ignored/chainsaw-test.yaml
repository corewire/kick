apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-008-imagepullsecrets-ignored
spec:
  steps:
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: assert-no-request
      try:
        - script:
            content: |
              set -eu
              deadline=$(( $(date +%s) + 45 ))
              while true; do
                count=$(kubectl -n kick-e2e-008 get kickrequests --no-headers 2>/dev/null | wc -l | tr -d ' ')
                if [ "$count" = "0" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "expected no KickRequest in kick-e2e-008" >&2
                  kubectl -n kick-e2e-008 get kickrequests -o yaml >&2 || true
                  exit 1
                fi
                sleep 2
              done
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-008
