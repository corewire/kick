# Promoted together with the rotated Secret. It needs a minute to report ready,
# which keeps the Argo CD Application unhealthy and therefore keeps the Kargo
# Stage on the same promotion long after the rotated Secret has already been
# applied to the cluster. That is the window in which KICK must observe the
# dependency change and refuse to restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-069
  namespace: kick-e2e-069
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-069
  template:
    metadata:
      labels:
        app: slow-069
    spec:
      containers:
        - name: slow
          image: docker.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["sleep", "3600"]
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 60
            periodSeconds: 5
