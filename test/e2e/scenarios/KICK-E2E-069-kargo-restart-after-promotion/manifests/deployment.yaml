apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-069
  namespace: kick-e2e-069
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-069
  template:
    metadata:
      labels:
        app: app-069
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
