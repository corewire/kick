# Promoted together with the rotated Secret, but in a later Argo CD sync wave.
# Argo CD applies the default wave 0 - the rotated Secret and the app - and only
# then starts wave 1, where this workload needs two minutes to report ready. The
# sync operation therefore stays Running, and with it the Kargo promotion, long
# after the rotated Secret has been applied to the cluster. That ordering is what
# makes the window in which KICK must refuse to restart deterministic instead of
# a race against how fast the promotion happens to finish.
#
# Nothing else in this directory carries a sync-wave annotation: the promoted
# Deployment must stay byte-identical to the initial one, because the API server
# bumps a Deployment's metadata.generation on annotation changes as well, which
# would make the "was it restarted?" assertion meaningless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-068
  namespace: kick-e2e-068
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-068
  template:
    metadata:
      labels:
        app: slow-068
    spec:
      containers:
        - name: slow
          image: docker.io/library/busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 120
            periodSeconds: 5
