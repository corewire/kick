apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-036-window-edit-reenqueues
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-036 manifests manifests
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-sync
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-036
                namespace: argocd
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-036
                namespace: kick-e2e-036
                # generation 1 proves the pod template has not been touched yet.
                generation: 1
              status:
                availableReplicas: 1
    - name: close-the-window
      try:
        - apply:
            file: windows-closed.yaml
    - name: rotate-secret
      try:
        - apply:
            file: updated/secret.yaml
    - name: open-the-window
      # No dependency changes here. Only the AppProject is edited, so the
      # KickRequest can only proceed if the window edit re-enqueues it.
      try:
        - apply:
            file: windows-open.yaml
    - name: assert-window-edit-releases-the-kick
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-036
                namespace: kick-e2e-036
              status:
                phase: Succeeded
                gate:
                  reason: Allowed
        # Exactly one rollout: generation 2, not 3.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-036
                namespace: kick-e2e-036
                generation: 2
    - name: cleanup
      try:
        - script:
            content: |
              kubectl -n argocd delete application kick-e2e-036 --ignore-not-found
              kubectl -n argocd delete appproject kick-e2e-036 --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-036
