apiVersion: v1
kind: Namespace
metadata:
  name: kick-e2e-036
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-036
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kick-e2e-036
  namespace: argocd
spec:
  description: Dedicated project for KICK-E2E-036.
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kick-e2e-036
  namespace: argocd
spec:
  project: kick-e2e-036
  source:
    repoURL: http://gitea.kick-e2e-git.svc.cluster.local:3000/kick-e2e/e2e-036.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kick-e2e-036
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-036
type: Opaque
stringData:
  token: alpha
