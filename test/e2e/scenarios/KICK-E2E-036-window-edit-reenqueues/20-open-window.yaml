apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-e2e-036
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: Auto
  schedule:
    # Editing the window to an always-active allow opens the gate.
    windows:
      - type: Allow
        cron: "* * * * *"
        duration: "1h"
