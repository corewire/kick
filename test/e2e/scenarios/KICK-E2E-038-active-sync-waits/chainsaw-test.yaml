apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kick-e2e-038-active-sync-waits
spec:
  steps:
    - name: seed-repository
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-038 manifests manifests
    - name: create-fixtures
      try:
        - apply:
            file: resources.yaml
    - name: wait-for-initial-sync
      try:
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: kick-e2e-038
                namespace: argocd
              status:
                sync:
                  status: Synced
                health:
                  status: Healthy
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-038
                namespace: kick-e2e-038
                generation: 1
              status:
                availableReplicas: 1
    - name: commit-secret-with-slow-hook
      try:
        - script:
            content: ../../setup/gitea/seed.sh e2e-038 manifests slow-sync "rotate secret behind a slow PostSync hook"
        - script:
            content: kubectl -n argocd annotate application kick-e2e-038 argocd.argoproj.io/refresh=hard --overwrite
    - name: assert-active-sync-blocks
      try:
        - assert:
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-038
                namespace: kick-e2e-038
              status:
                phase: WaitingForApplicationSync
                gate:
                  reason: OwnerReconciling
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-038
                namespace: kick-e2e-038
                generation: 1
    - name: assert-kick-runs-once-the-sync-settles
      try:
        - assert:
            timeout: 4m
            resource:
              apiVersion: kick.corewire.io/v1alpha1
              kind: KickRequest
              metadata:
                name: deployment-app-038
                namespace: kick-e2e-038
              status:
                phase: Succeeded
                gate:
                  reason: Allowed
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-038
                namespace: kick-e2e-038
                generation: 2
    - name: cleanup
      try:
        - script:
            content: kubectl -n argocd delete application kick-e2e-038 --ignore-not-found
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: kick-e2e-038
