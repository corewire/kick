apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-e2e-038
type: Opaque
stringData:
  token: beta
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-038
  namespace: kick-e2e-038
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-038
  template:
    metadata:
      labels:
        app: app-038
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
# A slow PostSync hook keeps status.operationState.phase on "Running" long
# after the rotated Secret has landed in the cluster. KICK must treat the
# Application as still reconciling and wait.
apiVersion: batch/v1
kind: Job
metadata:
  name: slow-post-sync
  namespace: kick-e2e-038
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: wait
          image: busybox:1.36
          command: ["sleep", "90"]
