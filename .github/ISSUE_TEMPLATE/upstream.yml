name: Upstream report
description: "Bug or limit in a dependency (Argo CD, Kargo, Argo Rollouts, Secrets Store CSI, controller-runtime, ...)."
title: "upstream: "
labels: ["type:upstream"]
projects: ["corewire/1"]
body:
  - type: input
    id: project
    attributes: {label: Project + upstream issue, description: "Pinned version; link existing upstream issue if any."}
    validations: {required: true}
  - type: textarea
    id: impact
    attributes: {label: Impact on KICK and local handling, description: "Symptom, affected scenarios, what KICK or the tests do about it."}
    validations: {required: true}
  - type: textarea
    id: good
    attributes: {label: GOOD, description: "Target behaviour / quality bar."}
    validations: {required: true}
  - type: textarea
    id: done
    attributes: {label: DONE, description: "Checkable exit criteria. Each one must be provable by a command + output."}
    validations: {required: true}
  - type: textarea
    id: proof
    attributes: {label: PROOF plan, description: "Exact commands/tests that will prove DONE."}
    validations: {required: true}
