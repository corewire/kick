name: Security risk
description: "Vulnerability or weakened safety invariant. Report exploitable issues privately, not here."
title: ""
labels: ["type:security"]
projects: ["corewire/1"]
body:
  - type: textarea
    id: path
    attributes: {label: Attack path or advisory, description: "Attacker, entry, steps, impact; or advisory IDs and reachable call path."}
    validations: {required: true}
  - type: dropdown
    id: sev
    attributes: {label: Severity, options: [high, med, low]}
    validations: {required: true}
  - type: dropdown
    id: decision
    attributes: {label: Handling, options: [mitigate, accept (needs ADR), defer]}
    validations: {required: true}
  - type: textarea
    id: good
    attributes: {label: GOOD, description: "Target behaviour / quality bar."}
    validations: {required: true}
  - type: textarea
    id: done
    attributes: {label: DONE, description: "Checkable exit criteria. Each one must be provable by a command + output."}
    validations: {required: true}
  - type: textarea
    id: proof
    attributes: {label: PROOF plan, description: "Exact commands/tests that will prove DONE."}
    validations: {required: true}
