name: Setup build environment
description: Go toolchain with module and build cache, plus version-pinned local tool binaries.

inputs:
  cache-key:
    description: Distinguishes the tool caches of jobs that install different tools.
    required: true
  tools:
    description: Space-separated make targets that install the tool binaries this job needs.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Go
      id: go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    - name: Cache local tool binaries
      uses: actions/cache@v6.1.0
      with:
        path: bin
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-key }}-${{ hashFiles('hack/tool-versions.mk') }}

    - name: Install local tools
      if: inputs.tools != ''
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: make ${TOOLS}
