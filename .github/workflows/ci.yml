name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Install local tools
        run: make tools

      - name: Format
        run: make fmt

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Unit and envtest smoke tests
        run: make test

      - name: Race tests
        run: go test -race ./...

      - name: Generate
        run: make generate manifests

      - name: Generated diff check
        run: git diff --exit-code

      - name: Helm lint
        run: make helm-lint

      - name: Helm template
        run: make helm-template

      - name: Docs generation check
        run: make docs-gen-check

      - name: Feature coverage checker tests
        run: make feature-coverage-test

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Feature coverage
        run: make feature-coverage

      - name: Feature coverage summary
        if: always()
        run: cat traceability/feature-coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload feature coverage report
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: feature-coverage-report
          path: traceability/feature-coverage-report.md

  e2e-core:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: make kind-create KIND=kind

      - name: Build, load, and install operator
        run: make kind-load install KIND=kind

      - name: Run core e2e scenarios
        run: make test-e2e-core KIND=kind

      - name: Delete kind cluster
        if: always()
        run: make kind-delete KIND=kind
