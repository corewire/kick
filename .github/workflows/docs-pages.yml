name: docs-pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs-pages.yml
      - README.md
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - docs/**
      - .github/workflows/docs-pages.yml
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-main:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: docs/go.mod
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: 0.166.0
          extended: true

      - name: Build docs site
        run: |
          cd docs
          hugo --minify

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./docs/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  deploy-pr-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        if: github.event.action != 'closed'
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        if: github.event.action != 'closed'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: docs/go.mod
          cache: true

      - name: Setup Hugo
        if: github.event.action != 'closed'
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: 0.166.0
          extended: true

      - name: Build preview site
        if: github.event.action != 'closed'
        run: |
          cd docs
          hugo --minify

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: docs/public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
