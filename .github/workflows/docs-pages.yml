name: docs-pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs-pages.yml
      - README.md
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - docs/**
      - .github/workflows/docs-pages.yml
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: docs/go.mod
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build docs site
        run: |
          cd docs
          hugo --minify

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public
          force_orphan: true

  deploy-pr-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    env:
      PREVIEW_PATH: pr-preview/pr-${{ github.event.number }}
      PREVIEW_URL: https://corewire.github.io/kick/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: docs/go.mod
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build preview site
        run: |
          cd docs
          hugo --minify --baseURL "${PREVIEW_URL}"

      - name: Deploy PR preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public
          destination_dir: ${{ env.PREVIEW_PATH }}
          keep_files: true

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Docs preview is ready.',
              '',
              `URL: ${process.env.PREVIEW_URL}`
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
