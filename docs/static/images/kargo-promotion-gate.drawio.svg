<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" font-family="system-ui, -apple-system, sans-serif" font-size="12" content="&lt;mxfile host=&quot;app.diagrams.net&quot;&gt;&lt;diagram name=&quot;Kargo promotion gate&quot; id=&quot;kargo-promotion-gate&quot;&gt;&lt;mxGraphModel dx=&quot;980&quot; dy=&quot;390&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;980&quot; pageHeight=&quot;390&quot; math=&quot;0&quot; shadow=&quot;0&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <rect width="980" height="390" fill="#fafafa" rx="8"/>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Kargo promotion gate</text>
  <text x="490" y="50" text-anchor="middle" font-size="12" fill="#666">provider Kargo blocks restarts during active Stage promotions</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a8f99"/>
    </marker>
  </defs>

  <rect x="40" y="104" width="220" height="78" rx="8" fill="#f3e8fd" stroke="#7209b7" stroke-width="1.6"/>
  <text x="150" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">KickRequest stale</text>
  <text x="150" y="154" text-anchor="middle" font-size="10" fill="#7209b7">provider: Kargo</text>

  <rect x="300" y="104" width="250" height="78" rx="8" fill="#fff0e6" stroke="#f97316" stroke-width="1.6"/>
  <text x="425" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Resolve authorized Stage</text>
  <text x="425" y="154" text-anchor="middle" font-size="10" fill="#f97316">from Application annotation</text>

  <rect x="590" y="104" width="220" height="78" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
  <text x="700" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Promotion running?</text>
  <text x="700" y="154" text-anchor="middle" font-size="10" fill="#1a73e8">pending or active</text>

  <rect x="560" y="258" width="240" height="84" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="1.6"/>
  <text x="680" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Blocked: OwnerReconciling</text>
  <text x="680" y="310" text-anchor="middle" font-size="10" fill="#ea4335">wait until promotion completes</text>

  <rect x="840" y="258" width="110" height="84" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.6"/>
  <text x="895" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Then</text>
  <text x="895" y="310" text-anchor="middle" font-size="10" fill="#34a853">Argo CD gate</text>

  <line x1="260" y1="143" x2="300" y2="143" stroke="#8a8f99" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="550" y1="143" x2="590" y2="143" stroke="#8a8f99" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="700" y1="182" x2="700" y2="258" stroke="#ea4335" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="810" y1="300" x2="840" y2="300" stroke="#34a853" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="712" y="205" width="34" height="18" rx="4" fill="#fafafa"/>
  <text x="729" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#ea4335">yes</text>
</svg>
