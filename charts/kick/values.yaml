namespace:
  create: true
  name: kick-system

rbac:
  create: true

argocd:
  enabled: true
  namespace: argocd
  applicationNamespaces:
    - "*"

requestRetention: 24h
rolloutTimeout: 15m

# Optional integrations. Each one needs its CRDs installed; KICK additionally
# probes the API server at startup and stays inactive when a CRD is absent.
integrations:
  # Restart Argo Rollouts through spec.restartAt.
  argoRollouts:
    enabled: false
  # Restart workloads when a Secrets Store CSI mounted secret rotates.
  secretsStoreCSI:
    enabled: false
  # Block restarts while a Kargo Promotion is in flight. Requires
  # spec.gitOps.provider: Kargo on the KickPolicy.
  kargo:
    enabled: false

image:
  repository: ghcr.io/corewire/kick
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: controller-manager

leaderElection:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /healthz
    port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    path: /readyz
    port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
