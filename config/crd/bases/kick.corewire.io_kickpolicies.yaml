                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - workloadSelector
                type: object
              dryRun:
                description: |-
                  DryRun evaluates every gate and freshness check as usual but never patches
                  a workload. Matching requests end in the terminal DryRun phase, so an
                  operator can see exactly what adopting this policy would restart.
                type: boolean
              gitOps:
                description: KickPolicyGitOpsSpec configures provider gate behavior.
                properties:
                  provider:
                    default: None
                    description: |-
                      Provider selects the GitOps gate. "None" (the default) restarts without
                      consulting any GitOps tool, gated only by any native schedule windows.
                    enum:
                    - None
                    - Auto
                    - ArgoCD
                    - Flux
                    - Kargo
                    type: string
                  requireReconciled:
                    default: true
                    description: |-
                      RequireReconciled is a correctness gate (not a schedule): wait until the
                      owning application has finished applying before restarting.
                    type: boolean
                type: object
              restart:
                description: KickPolicyRestartSpec groups restart behavior so future
                  knobs are additive.
                properties:
                  minInterval:
                    default: 30s
                    description: MinInterval is the minimum time between restarts
                      of the same workload.
                    pattern: ^$|^([0-9]+(ns|us|µs|ms|s|m|h))+$
                    type: string
                type: object
              schedule:
                description: 'KickPolicyScheduleSpec is the native time gate: pure
                  scheduling, no GitOps.'
                properties:
                  windows:
                    description: Windows are KICK-native restart windows. Omit to
                      allow restarts at any time.
                    items:
                      description: |-
                        KickPolicyWindow is a KICK-native restart window, evaluated independently of
                        any GitOps provider.
                      properties:
                        cron:
                          description: Cron is a standard 5-field cron expression
                            marking each window start.
                          type: string
                        duration:
                          description: Duration is how long the window stays open
                            from each start (e.g. "1h").
                          pattern: ^([0-9]+(ns|us|µs|ms|s|m|h))+$
                          type: string
                        timeZone:
                          description: TimeZone is the IANA zone used to evaluate
                            the cron expression (default UTC).
                          type: string
                        type:
                          description: KickPolicyWindowType selects allow or deny
                            semantics for a native window.
                          enum:
                          - Allow
                          - Deny
                          type: string
                      required:
                      - cron
                      - duration
                      - type
                      type: object
                    type: array
                type: object
              suspend:
                description: |-
                  Suspend pauses the policy: it matches nothing and issues no restarts until
                  unset, without deleting the object.
                type: boolean
            required:
