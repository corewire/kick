                    description: TimeoutSeconds bounds a single delivery attempt.
                    format: int32
                    maximum: 120
                    minimum: 1
                    type: integer
                  tls:
                    description: NotificationTLS configures transport security for
                      the webhook endpoint.
                    properties:
                      caBundle:
                        description: CABundle references a PEM bundle used to verify
                          the endpoint certificate.
                        properties:
                          key:
                            minLength: 1
                            type: string
                          name:
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      clientCertificate:
                        description: |-
                          ClientCertificate references a Secret of type kubernetes.io/tls used for
                          mTLS. Both tls.crt and tls.key must be present.
                        properties:
                          key:
                            minLength: 1
                            type: string
                          name:
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  url:
