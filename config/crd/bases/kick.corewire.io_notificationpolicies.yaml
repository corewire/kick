                type: integer
              failed:
                format: int64
                type: integer
              lastDeliveryTime:
                format: date-time
                type: string
              lastError:
                description: |-
                  LastError is the failure message of the most recent failed delivery. It
                  never contains request or response bodies.
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
