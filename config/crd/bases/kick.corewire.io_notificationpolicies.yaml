metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: notificationpolicies.kick.corewire.io
spec:
  group: kick.corewire.io
  names:
    kind: NotificationPolicy
    listKind: NotificationPolicyList
    plural: notificationpolicies
    shortNames:
    - notificationpolicy
    singular: notificationpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.webhook.url
      name: URL
      type: string
    - jsonPath: .status.delivered
      name: Delivered
      type: integer
    - jsonPath: .status.failed
      name: Failed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NotificationPolicySpec selects which KickRequest transitions are delivered
              where.
            properties:
              phases:
                description: |-
                  Phases limits notifications to these KickRequest phases. Omit to notify on
                  every terminal phase (Succeeded, Failed, NoLongerRequired, DryRun).
                items:
                  description: KickRequestPhase is the lifecycle state of a durable
                    restart request.
                  type: string
                type: array
              suspend:
                description: Suspend stops delivery without deleting the object.
                type: boolean
              webhook:
                description: NotificationWebhook is the delivery target.
                properties:
                  auth:
                    description: |-
                      NotificationAuth selects one authentication scheme. At most one field may be
                      set.
                    properties:
                      basic:
                        description: 'Basic sends "Authorization: Basic <base64(user:pass)>".'
                        properties:
                          password:
                            description: |-
                              SecretKeyRef selects a single key from a Secret in the same namespace as the
                              NotificationPolicy. Credentials are never inlined in the spec.
                            properties:
                              key:
                                minLength: 1
                                type: string
                              name:
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          username:
                            description: |-
                              SecretKeyRef selects a single key from a Secret in the same namespace as the
                              NotificationPolicy. Credentials are never inlined in the spec.
                            properties:
                              key:
                                minLength: 1
                                type: string
                              name:
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - password
                        - username
                        type: object
                      bearerToken:
                        description: 'BearerToken sends "Authorization: Bearer <token>".'
                        properties:
                          key:
                            minLength: 1
                            type: string
                          name:
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  headers:
                    items:
                      description: |-
                        NotificationHeader adds a request header. Use ValueFrom for anything secret;
                        Value is only for non-sensitive routing headers.
                      properties:
                        name:
                          minLength: 1
                          type: string
                        value:
                          type: string
                        valueFrom:
                          description: |-
                            SecretKeyRef selects a single key from a Secret in the same namespace as the
                            NotificationPolicy. Credentials are never inlined in the spec.
                          properties:
                            key:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  method:
                    default: POST
                    enum:
                    - POST
                    - PUT
                    type: string
                  timeoutSeconds:
