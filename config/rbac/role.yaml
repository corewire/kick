# Hand-maintained. Adding a +kubebuilder:rbac marker anywhere in the tree makes
# `make manifests` generate this file and drop every rule listed here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create", "patch", "update"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["apps"]
  resources: ["statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["kick.corewire.io"]
  resources: ["kickrequests"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["kick.corewire.io"]
  resources: ["kickrequests/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["kick.corewire.io"]
  resources: ["kickpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kick.corewire.io"]
  resources: ["notificationpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kick.corewire.io"]
  resources: ["notificationpolicies/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["argoproj.io"]
  resources: ["applications", "appprojects"]
  verbs: ["get", "list", "watch"]
# Optional integration: Argo Rollouts as a restartable workload kind.
- apiGroups: ["argoproj.io"]
  resources: ["rollouts"]
  verbs: ["get", "list", "watch", "patch"]
# Optional integration: Secrets Store CSI rotation detection.
- apiGroups: ["secrets-store.csi.x-k8s.io"]
  resources: ["secretproviderclasses", "secretproviderclasspodstatuses"]
  verbs: ["get", "list", "watch"]
# Optional integration: Kargo promotion gating.
- apiGroups: ["kargo.akuity.io"]
  resources: ["stages", "promotions"]
  verbs: ["get", "list", "watch"]
