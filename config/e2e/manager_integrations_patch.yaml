# Optional integrations exercised by the integration suites. Both flags are
# no-ops when the corresponding CRD is absent, so a single overlay serves every
# suite.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --enable-argo-rollouts
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --enable-csi-integration
