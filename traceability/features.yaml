- id: KICK-FEAT-023
  name: Secrets Store CSI rotation detection
  spec: ai-docs/gap-analysis/02-secrets-store-csi.md
  task: ai-docs/gap-analysis/02-secrets-store-csi.md
  tests:
    unit: required
    envtest: not_applicable
    e2e: not_applicable
  coverage:
    unit:
    - internal/dependency/csi_test.go
    - internal/observation/secretproviderclass_test.go
  rationale:
    envtest: The SecretProviderClass and SecretProviderClassPodStatus CRDs belong to
      the Secrets Store CSI driver, are not part of this repository, and are handled
      as unstructured objects, so envtest would only assert upstream schemas.
    e2e: Exercising rotation requires the Secrets Store CSI driver plus a real secret
      store provider, neither of which is installed in the e2e kind cluster.
  e2e: []
