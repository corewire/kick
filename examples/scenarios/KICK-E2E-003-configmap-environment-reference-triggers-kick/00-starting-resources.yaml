apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-003
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-003
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: Auto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-003
  namespace: kick-example-003
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-003
  template:
    metadata:
      labels:
        app: app-003
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          env:
            - name: MODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: mode
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kick-example-003
data:
  mode: alpha
