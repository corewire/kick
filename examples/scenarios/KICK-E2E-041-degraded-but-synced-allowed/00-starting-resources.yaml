apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-041
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-041
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-041
  namespace: kick-example-041
  annotations:
    argocd.argoproj.io/tracking-id: app-041:apps/Deployment:kick-example-041/app-041
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-041
  template:
    metadata:
      labels:
        app: app-041
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-041
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-041
  namespace: argocd
spec:
  project: proj-041
  destination:
    namespace: kick-example-041
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-041-degraded-but-synced-allowed
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-041
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-041
      server: https://kubernetes.default.svc
