apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-002
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-002
spec:
  discovery:
    mode: Auto
  gitOps:
    provider: Auto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-002
  namespace: kick-example-002
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-002
  template:
    metadata:
      labels:
        app: app-002
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: token
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-002
type: Opaque
stringData:
  token: alpha
