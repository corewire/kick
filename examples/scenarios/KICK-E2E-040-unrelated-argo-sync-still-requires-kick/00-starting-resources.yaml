apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-040
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-040
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-040
  namespace: kick-example-040
  annotations:
    argocd.argoproj.io/tracking-id: app-040:apps/Deployment:kick-example-040/app-040
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-040
  template:
    metadata:
      labels:
        app: app-040
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-040
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-040
  namespace: argocd
spec:
  project: proj-040
  destination:
    namespace: kick-example-040
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-040-unrelated-argo-sync-still-requires-kick
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-040
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-040
      server: https://kubernetes.default.svc
