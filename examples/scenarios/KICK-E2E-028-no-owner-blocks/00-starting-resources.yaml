apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-028
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-028
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-028
  namespace: kick-example-028
  annotations:
    argocd.argoproj.io/tracking-id: app-028:apps/Deployment:kick-example-028/app-028
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-028
  template:
    metadata:
      labels:
        app: app-028
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-028
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-028
  namespace: application-team-a
spec:
  project: proj-028
  destination:
    namespace: kick-example-028
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-028-no-owner-blocks
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-028
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-028
      server: https://kubernetes.default.svc
