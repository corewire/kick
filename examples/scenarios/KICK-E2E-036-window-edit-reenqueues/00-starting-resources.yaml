apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-036
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-036
spec:
  discovery:
    mode: Auto
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-036
  namespace: kick-example-036
  annotations:
    argocd.argoproj.io/tracking-id: app-036:apps/Deployment:kick-example-036/app-036
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-036
  template:
    metadata:
      labels:
        app: app-036
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-036
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-036
  namespace: argocd
spec:
  project: proj-036
  destination:
    namespace: kick-example-036
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-036-window-edit-reenqueues
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-036
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-036
      server: https://kubernetes.default.svc
