apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-048
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-048
spec:
  discovery:
    mode: Auto
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-048
  namespace: kick-example-048
  annotations:
    argocd.argoproj.io/tracking-id: app-048:apps/Deployment:kick-example-048/app-048
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-048
  template:
    metadata:
      labels:
        app: app-048
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-048
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-048
  namespace: application-team-a
spec:
  project: proj-048
  destination:
    namespace: kick-example-048
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-048-restart-while-waiting-for-window
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-048
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-048
      server: https://kubernetes.default.svc
