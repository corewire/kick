apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-012
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-012
spec:
  discovery: {}
  gitOps:
    provider: Auto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-012
  namespace: kick-example-012
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-012
  template:
    metadata:
      labels:
        app: app-012
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-012
type: Opaque
stringData:
  token: alpha
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kick-example-012
data:
  mode: alpha
