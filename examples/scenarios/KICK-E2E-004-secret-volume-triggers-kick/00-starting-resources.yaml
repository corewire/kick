apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-004
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-004
spec:
  discovery: {}
  gitOps:
    provider: Auto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-004
  namespace: kick-example-004
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-004
  template:
    metadata:
      labels:
        app: app-004
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          volumeMounts:
            - name: app-secret
              mountPath: /etc/app/secret
      volumes:
        - name: app-secret
          secret:
            secretName: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-004
type: Opaque
stringData:
  token: alpha
