apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-039
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-039
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-039
  namespace: kick-example-039
  annotations:
    argocd.argoproj.io/tracking-id: app-039:apps/Deployment:kick-example-039/app-039
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-039
  template:
    metadata:
      labels:
        app: app-039
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-039
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-039
  namespace: argocd
spec:
  project: proj-039
  destination:
    namespace: kick-example-039
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-039-argo-sync-rollout-satisfies-request
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-039
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-039
      server: https://kubernetes.default.svc
