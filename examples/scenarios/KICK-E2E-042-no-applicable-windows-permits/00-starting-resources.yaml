apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-042
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-042
spec:
  discovery: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-042
  namespace: kick-example-042
  annotations:
    argocd.argoproj.io/tracking-id: app-042:apps/Deployment:kick-example-042/app-042
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-042
  template:
    metadata:
      labels:
        app: app-042
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-042
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-042
  namespace: argocd
spec:
  project: proj-042
  destination:
    namespace: kick-example-042
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-042-no-applicable-windows-permits
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-042
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-042
      server: https://kubernetes.default.svc
