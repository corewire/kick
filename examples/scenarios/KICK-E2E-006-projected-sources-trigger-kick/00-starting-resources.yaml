apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-006
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-006
spec:
  discovery: {}
  gitOps:
    provider: Auto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-006
  namespace: kick-example-006
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-006
  template:
    metadata:
      labels:
        app: app-006
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          volumeMounts:
            - name: app-projected
              mountPath: /etc/app/projected
      volumes:
        - name: app-projected
          projected:
            sources:
              - secret:
                  name: app-secret
              - configMap:
                  name: app-config
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-006
type: Opaque
stringData:
  token: alpha
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kick-example-006
data:
  mode: alpha
