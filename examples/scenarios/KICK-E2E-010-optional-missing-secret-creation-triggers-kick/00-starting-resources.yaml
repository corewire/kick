apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-010
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-010
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: Auto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-010
  namespace: kick-example-010
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-010
  template:
    metadata:
      labels:
        app: app-010
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
                optional: true
