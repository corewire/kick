apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-049
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-049
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-049
  namespace: kick-example-049
  annotations:
    argocd.argoproj.io/tracking-id: app-049:apps/Deployment:kick-example-049/app-049
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-049
  template:
    metadata:
      labels:
        app: app-049
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-049
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-049
  namespace: application-team-a
spec:
  project: proj-049
  destination:
    namespace: kick-example-049
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-049-restart-while-waiting-for-sync
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-049
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-049
      server: https://kubernetes.default.svc
