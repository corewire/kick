apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-030
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-030
spec:
  discovery:
    workloadSelector: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-030
  namespace: kick-example-030
  annotations:
    argocd.argoproj.io/tracking-id: app-030:apps/Deployment:kick-example-030/app-030
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-030
  template:
    metadata:
      labels:
        app: app-030
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-030
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-030
  namespace: argocd
spec:
  project: proj-030
  destination:
    namespace: kick-example-030
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-030-appproject-control-plane-namespace
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-030
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-030
      server: https://kubernetes.default.svc
