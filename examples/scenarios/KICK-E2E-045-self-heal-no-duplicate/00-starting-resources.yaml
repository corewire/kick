apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-045
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-045
spec:
  discovery: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-045
  namespace: kick-example-045
  annotations:
    argocd.argoproj.io/tracking-id: app-045:apps/Deployment:kick-example-045/app-045
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-045
  template:
    metadata:
      labels:
        app: app-045
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-045
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-045
  namespace: application-team-a
spec:
  project: proj-045
  destination:
    namespace: kick-example-045
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-045-self-heal-no-duplicate
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-045
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-045
      server: https://kubernetes.default.svc
