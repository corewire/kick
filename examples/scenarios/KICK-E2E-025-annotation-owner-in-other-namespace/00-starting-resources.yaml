apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-025
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-025
spec:
  discovery: {}
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-025
  namespace: kick-example-025
  annotations:
    argocd.argoproj.io/tracking-id: app-025:apps/Deployment:kick-example-025/app-025
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-025
  template:
    metadata:
      labels:
        app: app-025
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-025
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-025
  namespace: application-team-a
spec:
  project: proj-025
  destination:
    namespace: kick-example-025
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-025-annotation-owner-in-other-namespace
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-025
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-025
      server: https://kubernetes.default.svc
