apiVersion: v1
kind: Namespace
metadata:
  name: kick-example-024
---
apiVersion: kick.corewire.io/v1alpha1
kind: KickPolicy
metadata:
  name: default
  namespace: kick-example-024
spec:
  discovery:
    mode: Auto
  gitOps:
    provider: ArgoCD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-024
  namespace: kick-example-024
  annotations:
    argocd.argoproj.io/tracking-id: app-024:apps/Deployment:kick-example-024/app-024
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-024
  template:
    metadata:
      labels:
        app: app-024
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kick-example-024
type: Opaque
stringData:
  token: alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-024
  namespace: argocd
spec:
  project: proj-024
  destination:
    namespace: kick-example-024
    server: https://kubernetes.default.svc
  source:
    repoURL: https://example.invalid/repo.git
    path: manifests/KICK-E2E-024-annotation-owner-in-argo-cd-namespace
    targetRevision: HEAD
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj-024
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: kick-example-024
      server: https://kubernetes.default.svc
